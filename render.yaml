services:
  - type: web
    name: erp-pro
    runtime: node
    plan: free
    buildCommand: npm install && cd src && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./database.sqlite
